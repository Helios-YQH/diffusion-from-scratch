# Cell C — UNet + rectified flow  (objective axis: eps -> flow matching)
# Protocol frozen 2026-09-20: see reports/exp_plan.md
#
#   torchrun --standalone --nproc_per_node=5 main.py train --config configs/celeba_unet_rf.yml

run_name: celeba_unet_rf
dataset: celeba
backbone: unet
objective: rf
t_sample: uniform

# ── Model ──────────────────────────────────────────────────────────
image_size: 64
base_channels: 128

# ── Training (identical across cells A-D) ──────────────────────────
epochs: 300
batch_size: 160
lr: 0.0002
warmup_steps: 2000
grad_clip: 1.0
ema_decay: 0.9999
seed: 42

# ── Checkpointing ──────────────────────────────────────────────────
save_interval: 50
sample_interval: 50
snapshot_interval: 50
num_workers: 4
resume: true
