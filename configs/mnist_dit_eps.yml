# MNIST cell B: DiT + DDPM (eps-prediction)
dataset: mnist
backbone: dit
objective: eps

image_size: 28
patch_size: 4          # 7x7 = 49 tokens
hidden_size: 384
depth: 6
num_heads: 6
timesteps: 1000

epochs: 200
batch_size: 256
lr: 0.0002
warmup_steps: 500

save_interval: 50
sample_interval: 50
snapshot_interval: 50
num_workers: 2
resume: false
