# DDPM CelebA 64x64 — full config
# Usage:
#   torchrun --standalone --nproc_per_node=5 main.py train --config configs/celeba.yml
#   python main.py train --config configs/celeba.yml
#
# Any CLI arg overrides the value below, e.g.:
#   python main.py train --config configs/celeba.yml --batch-size 128 --lr 2e-4

dataset: celeba

# ── Model ──────────────────────────────────────────────────────────
image_size: 64
base_channels: 128
timesteps: 1000

# ── Training ───────────────────────────────────────────────────────
epochs: 500
batch_size: 160       # per-GPU batch size
lr: 0.0005            # 5e-4
warmup_steps: 2000

# ── Checkpointing ──────────────────────────────────────────────────
save_interval: 50     # save full training state every N epochs
sample_interval: 20   # generate sample grid every N epochs
num_workers: 4
resume: true          # auto-resume from checkpoints/{run_name}_latest.pt
